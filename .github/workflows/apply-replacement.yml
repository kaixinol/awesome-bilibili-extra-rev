name: Apply Replacement

on:
  issues:
    types: [labeled]

jobs:
  apply-replacement:
    if: github.event.label.name == 'apply-replacement'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true

      - name: Extract checked items from issue body
        id: extract-replacements
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          ISSUE_BODY=$(gh issue view "$ISSUE_NUMBER" --json body --jq '.body')

          # Format in issue: - [x] [Original](url1) → [Replacement](url2)
          PAIRS=""
          while IFS= read -r line; do
            if [[ "$line" =~ ^-\ \[x\] ]]; then
              # Extract original URL
              ORIGINAL=$(echo "$line" | grep -oP '\]\(\Khttps://github\.com/[^)]+' | head -1 || true)
              # Extract replacement URL
              REPLACEMENT=$(echo "$line" | grep -oP '→ \[.*?\]\(\Khttps://github\.com/[^)]+' || true)
              
              if [ -n "$ORIGINAL" ] && [ -n "$REPLACEMENT" ]; then
                PAIRS="${PAIRS}${ORIGINAL}|${REPLACEMENT}|"
              fi
            fi
          done <<< "$ISSUE_BODY"

          echo "replacements=${PAIRS%|}" >> "$GITHUB_OUTPUT"

          if [ -z "$PAIRS" ]; then
            echo "No items selected for replacement. All projects will be kept."
            exit 0
          fi
          echo "Projects to replace:"
          echo "$PAIRS" | tr '|' '\n' | sed '/^$/d'

      - name: Apply replacement
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLACEMENTS: ${{ steps.extract-replacements.outputs.replacements }}
        run: |
          node src/generators/apply-replacement.js

      - name: Create PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet HEAD -- RAW_DATA/; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            BRANCH_NAME="replacement-$(date +%Y%m%d-%H%M%S)"
            ISSUE_NUMBER="${{ github.event.issue.number }}"

            git checkout -b "$BRANCH_NAME"
            git add RAW_DATA/
            git commit -m "feat: replace deprecated projects with alternatives"
            git push -u origin "$BRANCH_NAME"

            # Create PR that links to and closes the issue
            gh pr create \
              --title "🔄 Apply replacement for #$ISSUE_NUMBER" \
              --body "Auto-generated replacement PR. Fixes #$ISSUE_NUMBER" \
              --base main \
              --head "$BRANCH_NAME"
          else
            echo "No changes to commit."
          fi
